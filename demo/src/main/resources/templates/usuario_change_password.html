<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container-form">
    <h1>Cambiar Contraseña</h1>

    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>
    <div th:if="${successMessage}" class="success-message">
        <p th:text="${successMessage}"></p>
    </div>

    <form th:action="@{/usuarios/{id}/change-password(id=${usuario.id})}" th:object="${passwordChangeDto}" method="post">
        <div>
            <label>Nueva contrasena:</label>
            <input type="password" th:field="*{password}" minlength="6" maxlength="30" required />
        </div>
        <div>
            <label>Confirmar contrasena:</label>
            <input type="password" th:field="*{confirmPassword}" minlength="6" maxlength="30" required />
        </div>
        <div>
            <button class="button" type="submit">Cambiar contraseña</button>
            <a th:href="${volverUrl != null ? volverUrl : '/usuarios'}"><button class="button" type="button">Volver</button></a>
        </div>
    </form>
</div>
</body>
</html>
