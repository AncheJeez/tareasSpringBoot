<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Empresa</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container-form">
        <h1 th:if="${empresa.id}" th:remove="tag">Editar Empresa</h1>
        <h1 th:unless="${empresa.id}" th:remove="tag">Crear Empresa</h1>
        
        <form th:action="${empresa.id} ? @{/empresas/{id}(id=${empresa.id})} : @{/empresas}" th:object="${empresa}" method="post">
            <div>
                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" minlength="4" maxlength="29" required />
                <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>
            <div>
                <label>CIF/NIF:</label>
                <input type="text" th:field="*{cif}" pattern="\d{9}" minlength="9" maxlength="9" required />
                <p class="error-message" th:if="${#fields.hasErrors('cif')}" th:errors="*{cif}"></p>
            </div>
            <div>
                <label>Direccion:</label>
                <input type="text" th:field="*{direccion}" required />
                <p class="error-message" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
            </div>
            
            <div>
                <label>Ciudad:</label>
                <input list="ciudades" 
                       type="text" 
                       th:field="*{ciudad}" 
                       minlength="3" 
                       maxlength="30" 
                       required 
                       onfocus="showAllDatalistOptions(this)" />
                       
                <datalist id="ciudades" th:if="${ciudades != null}">
                    <option th:each="c : ${ciudades}" th:value="${c}"></option>
                </datalist>
                <small style="display: block; margin-top: 4px; color: #666;">
                    Haz clic para desplegar todas las opciones o escribe una nueva.
                </small>
                <p class="error-message" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}"></p>
            </div>
            
            <div>
                <label>Codigo Postal:</label>
                <input type="text" th:field="*{codigoPostal}" required />
                <p class="error-message" th:if="${#fields.hasErrors('codigoPostal')}" th:errors="*{codigoPostal}"></p>
            </div>
            <div>
                <label>Telefono:</label>
                <input type="text" th:field="*{telefono}" pattern="\d{9}" minlength="9" maxlength="9" required />
                <p class="error-message" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
            </div>
            <div>
                <label>Email:</label>
                <input type="email" th:field="*{email}" required />
                <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div>
                <button class="button" type="submit" th:text="${empresa.id} ? 'Actualizar Empresa' : 'Guardar Empresa'">Guardar</button>
                <a th:href="@{/empresas}"><button class="button" type="button">Volver</button></a>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        function showAllDatalistOptions(input) {
            const currentValue = input.value;
            input.value = '';
            setTimeout(() => {
                input.value = currentValue;
            }, 1);
        }
    </script>
</body>
</html>
