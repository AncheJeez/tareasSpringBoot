<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container-form">
        <b>
            <h1 th:if="${usuario.id}" th:remove="tag">Editar Usuario</h1>
            <h1 th:unless="${usuario.id}" th:remove="tag">Crear Usuario</h1>
        </b>

        <div th:if="${param.error}" class="error-message">
            <p th:if="${param.error == 'email'}" th:remove="tag">El email ya esta registrado. Usa otro email.</p>
            <p th:if="${param.error == 'password'}" th:remove="tag">La contrasena es obligatoria.</p>
            <p th:if="${param.error == 'empresa'}" th:remove="tag">Empresa no encontrada.</p>
        </div>

        <div th:if="${empresaError}" class="error-message">
            <p th:text="${empresaError}">Debes seleccionar una empresa valida.</p>
        </div>

        <form th:action="${usuario.id} ? @{/usuarios/{id}(id=${usuario.id})} : @{/usuarios}" th:object="${usuario}" method="post">
            <div>
                <label>Email:</label>
                <input type="email" th:field="*{email}" minlength="5" maxlength="20" required />
                <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div>
                <label>Contrasena:</label>
                <input type="password" th:field="*{password}" />
                <p class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div>
                <label>Nombre:</label>
                <input type="text" th:field="*{nombre}" minlength="5" maxlength="20" required />
                <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>
            <div>
                <label>Apellido:</label>
                <input type="text" th:field="*{apellido}" minlength="5" maxlength="20" required />
                <p class="error-message" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></p>
            </div>
            <div>
                <label>Telefono:</label>
                <input type="text" th:field="*{telefono}" pattern="\d{9}" minlength="9" maxlength="9" required />
                <p class="error-message" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
            </div>

            <div>
                <label>Empresa:</label>
                <select name="empresaId" required>
                    <option value="" disabled th:selected="${selectedEmpresaId == null}">Choose business</option>
                    <option th:each="e : ${empresas}"
                            th:value="${e.id}"
                            th:selected="${selectedEmpresaId != null and selectedEmpresaId == e.id}"
                            th:text="${e.nombre}">
                    </option>
                </select>
            </div>

            <div>
                <button class="button" type="submit" th:text="${usuario.id} ? 'Actualizar Usuario' : 'Guardar Usuario'">Guardar</button>
                <a th:href="${volverUrl ?: '/'}"><button class="button" type="button">Volver</button></a>
            </div>

        </form>
    </div>
</body>
</html>
